# verafides.ch: Sicherheits-Header und Komprimierung (Server-Kontext, eingebunden von ops/alt-setup.sh).
# Bewusst ohne Content-Security-Policy: die Hugo-Seite hat Inline-Skripte, Listmonk eigene Seiten.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

gzip_vary on;
gzip_proxied any;
gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml text/plain;
