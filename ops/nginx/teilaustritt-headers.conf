# teilaustritt.ch: Sicherheits-Header und Komprimierung (Server-Kontext, eingebunden von ops/alt-setup.sh).
# Die Locations setzen Caching nur mit «expires», damit diese add_header-Zeilen überall gelten
# (ein add_header in einer Location würde sie sonst aufheben).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# geo.admin.ch: Strassensuche und Adressprüfung; inline nur Styles (style-Attribute), keine Inline-Skripte
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api3.geo.admin.ch; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml text/plain;
